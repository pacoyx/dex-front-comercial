<div class="unauthorized-shell">

    <mat-card class="unauthorized-card" appearance="outlined">
        <div class="unauthorized-card__icon">
            <mat-icon>block</mat-icon>
        </div>
        <h1>No tienes permiso para acceder a esta sección</h1>
        <p>Tu usuario no cuenta con el permiso necesario para ver este contenido. Si crees que esto es un error,
            comunícate con el administrador del sistema.</p>
        <button mat-flat-button color="primary" routerLink="/profileUser">
            <mat-icon>arrow_back</mat-icon>
            Volver
        </button>
    </mat-card>

</div>
