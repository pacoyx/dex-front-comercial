<div class="login-shell">

    <mat-card class="login-card" appearance="outlined">

        <div class="login-card__brand">
            <img src="logo.jpg" alt="Logo" class="login-card__logo">
            <div class="login-card__heading">
                <h1>Iniciar Sesión</h1>
                <span class="login-card__subtitle">Ingresa tus credenciales para continuar</span>
            </div>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

            <mat-form-field appearance="outline" class="login-form__field">
                <mat-label>Usuario</mat-label>
                <input matInput placeholder="Nombre de usuario" type="text" formControlName="username">
                <mat-icon matPrefix>person</mat-icon>
                <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
                    El campo de usuario es obligatorio.
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="login-form__field">
                <mat-label>Contraseña</mat-label>
                <input matInput placeholder="Contraseña" [type]="hide() ? 'password' : 'text'"
                    formControlName="password">
                <mat-icon matPrefix>lock</mat-icon>
                <button type="button" mat-icon-button matSuffix (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide()">
                    <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
                <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
                    El campo de contraseña es obligatorio.
                </mat-error>
            </mat-form-field>

            <a href="#" class="login-form__forgot-link" (click)="olvideContrasena($event)">¿Olvidaste tu
                contraseña?</a>

            <button mat-flat-button color="primary" type="submit" class="login-form__submit"
                [disabled]="loginForm.invalid || loading()">
                @if (loading()) {
                <ng-container>
                    <app-loading></app-loading>
                    <span>Procesando...</span>
                </ng-container>
                } @else {
                <ng-container>
                    <mat-icon>login</mat-icon>
                    <span>Iniciar Sesión</span>
                </ng-container>
                }
            </button>

            @if (showError()) {
            <div class="login-form__error">
                <mat-icon>error_outline</mat-icon>
                <span>{{ errorMessage }}</span>
            </div>
            }

        </form>

        <div class="login-card__footer">
            <span>¿No tienes una cuenta?</span>
            <a href="#" (click)="solicitarAcceso($event)">Solicita acceso</a>
        </div>

    </mat-card>

</div>
