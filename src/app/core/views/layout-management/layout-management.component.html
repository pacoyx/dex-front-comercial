<div class="module-shell">

  <mat-toolbar class="module-toolbar">

    <button mat-icon-button class="module-toolbar__menu-btn" aria-label="Menú">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="module-toolbar__title">Administración de Sistema</span>

    <nav class="module-toolbar__nav">
      <a mat-button class="module-toolbar__link" routerLink="/management/dashboard" routerLinkActive="is-active">
        <mat-icon>dashboard</mat-icon><span>Dashboard</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/management/empresa" routerLinkActive="is-active">
        <mat-icon>apartment</mat-icon><span>Empresa</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/management/usuarios" routerLinkActive="is-active">
        <mat-icon>person</mat-icon><span>Usuarios</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/management/configuraciones" routerLinkActive="is-active">
        <mat-icon>settings</mat-icon><span>Configuraciones</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/management/roles" routerLinkActive="is-active">
        <mat-icon>admin_panel_settings</mat-icon><span>Roles</span>
      </a>

      <button mat-button class="module-toolbar__link" [matMenuTriggerFor]="modulosMenu">
        <mat-icon>apps</mat-icon><span>Módulos</span>
      </button>
      <mat-menu #modulosMenu="matMenu">
        <button mat-menu-item [routerLink]="['/recepcion/emision']" routerLinkActive="router-link-active">
          <mat-icon>storefront</mat-icon>
          Recepción
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/purchase/dashboard']" routerLinkActive="router-link-active">
          <mat-icon>shopping_cart</mat-icon>
          Compras
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/facturacion/facturas']" routerLinkActive="router-link-active">
          <mat-icon>receipt_long</mat-icon>
          Facturación
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/rrhh/dashboard']" routerLinkActive="router-link-active">
          <mat-icon>groups</mat-icon>
          RRHH
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/roperia/dashboard']" routerLinkActive="router-link-active">
          <mat-icon>checkroom</mat-icon>
          Ropería
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/profileUser']" routerLinkActive="router-link-active">
          <mat-icon>account_circle</mat-icon>
          Mi Cuenta
        </button>
      </mat-menu>
    </nav>

    <span class="module-toolbar__spacer"></span>

  </mat-toolbar>

  <div class="module-shell__content">
    <router-outlet></router-outlet>
  </div>

</div>
