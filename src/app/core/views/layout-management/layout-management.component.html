<div class="module-shell">

  <mat-toolbar class="module-toolbar">

    <button mat-icon-button class="module-toolbar__menu-btn" (click)="toggleSidenav()" aria-label="Abrir menú principal">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="module-toolbar__title">Administración de Sistema</span>

    <nav class="module-toolbar__nav">
      @if (hasPermission('dashboard.access')) {
      <a mat-button class="module-toolbar__link" routerLink="/management/dashboard" routerLinkActive="is-active">
        <mat-icon>dashboard</mat-icon><span>Dashboard</span>
      </a>
      }
      <a mat-button class="module-toolbar__link" routerLink="/management/empresa" routerLinkActive="is-active">
        <mat-icon>apartment</mat-icon><span>Empresa</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/management/usuarios" routerLinkActive="is-active">
        <mat-icon>person</mat-icon><span>Usuarios</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/management/roles" routerLinkActive="is-active">
        <mat-icon>admin_panel_settings</mat-icon><span>Roles</span>
      </a>

      <button mat-button class="module-toolbar__link" [matMenuTriggerFor]="configuracionesMenu">
        <mat-icon>settings</mat-icon><span>Configuraciones</span>
      </button>
      <mat-menu #configuracionesMenu="matMenu">
        <button mat-menu-item [routerLink]="['/management/configuraciones']" routerLinkActive="router-link-active">
          <mat-icon>tune</mat-icon>
          General
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/management/sucursales']" routerLinkActive="router-link-active">
          <mat-icon>storefront</mat-icon>
          Sucursales
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/management/impresoras']" routerLinkActive="router-link-active">
          <mat-icon>print</mat-icon>
          Impresoras
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/management/workerNodes']" routerLinkActive="router-link-active">
          <mat-icon>dns</mat-icon>
          Estaciones de Trabajo
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/management/impresionesPendientes']" routerLinkActive="router-link-active">
          <mat-icon>print</mat-icon>
          Impresiones Pendientes
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/management/dashboardprinters']" routerLinkActive="router-link-active">
          <mat-icon>dashboard</mat-icon>
          Dashboard Printers
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/management/cuentasCorreo']" routerLinkActive="router-link-active">
          <mat-icon>mail</mat-icon>
          Cuentas de Correo
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/management/bancos']" routerLinkActive="router-link-active">
          <mat-icon>account_balance</mat-icon>
          Bancos
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/management/tiposCuentaBancaria']" routerLinkActive="router-link-active">
          <mat-icon>savings</mat-icon>
          Tipos de Cuenta Bancaria
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/management/correosProgramados']" routerLinkActive="router-link-active">
          <mat-icon>schedule_send</mat-icon>
          Correos Programados
        </button>
      </mat-menu>
    </nav>

    <span class="module-toolbar__spacer"></span>

    <button mat-button class="module-toolbar__user" [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
      <span>{{ loginService.getLoginData()?.userName }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item [routerLink]="['/profileUser']" routerLinkActive="router-link-active">
        <mat-icon>settings</mat-icon>
        Profile
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
        Cerrar Sesion
      </button>
    </mat-menu>

  </mat-toolbar>

  <div class="module-shell__content">
    <router-outlet></router-outlet>
  </div>

</div>
