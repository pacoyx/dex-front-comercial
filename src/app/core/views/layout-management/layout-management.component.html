<div class="module-shell">

  <mat-toolbar class="module-toolbar">

    <button mat-icon-button class="module-toolbar__menu-btn" aria-label="Menú">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="module-toolbar__title">Administración de Sistema</span>

    <nav class="module-toolbar__nav">
      <a mat-button class="module-toolbar__link" routerLink="/management/dashboard" routerLinkActive="is-active">
        <mat-icon>dashboard</mat-icon><span>Dashboard</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/management/empresa" routerLinkActive="is-active">
        <mat-icon>apartment</mat-icon><span>Empresa</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/management/usuarios" routerLinkActive="is-active">
        <mat-icon>person</mat-icon><span>Usuarios</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/management/configuraciones" routerLinkActive="is-active">
        <mat-icon>settings</mat-icon><span>Configuraciones</span>
      </a>
    </nav>

    <span class="module-toolbar__spacer"></span>

  </mat-toolbar>

  <div class="module-shell__content">
    <router-outlet></router-outlet>
  </div>

</div>
