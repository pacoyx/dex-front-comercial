<div class="module-shell">

  <mat-toolbar class="module-toolbar">

    <button mat-icon-button class="module-toolbar__menu-btn" (click)="toggleSidenav()" aria-label="Abrir menú principal">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="module-toolbar__title">Mi Cuenta</span>

    <nav class="module-toolbar__nav">
      <button mat-button class="module-toolbar__link" [matMenuTriggerFor]="modulosMenu">
        <mat-icon>apps</mat-icon><span>Módulos</span>
      </button>
      <mat-menu #modulosMenu="matMenu">
        <button mat-menu-item [routerLink]="['/recepcion/emision']" routerLinkActive="router-link-active">
          <mat-icon>storefront</mat-icon>
          Recepción
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/purchase/dashboard']" routerLinkActive="router-link-active">
          <mat-icon>shopping_cart</mat-icon>
          Compras
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/facturacion/facturas']" routerLinkActive="router-link-active">
          <mat-icon>receipt_long</mat-icon>
          Facturación
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/rrhh/dashboard']" routerLinkActive="router-link-active">
          <mat-icon>groups</mat-icon>
          RRHH
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/roperia/dashboard']" routerLinkActive="router-link-active">
          <mat-icon>checkroom</mat-icon>
          Ropería
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/management/dashboard']" routerLinkActive="router-link-active">
          <mat-icon>admin_panel_settings</mat-icon>
          Administración
        </button>
      </mat-menu>
    </nav>

    <span class="module-toolbar__spacer"></span>

    <button mat-button class="module-toolbar__user" [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
      <span>{{ loginService.getLoginData()?.userName }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
        Cerrar Sesion
      </button>
    </mat-menu>

  </mat-toolbar>

  <div class="module-shell__content">
    <router-outlet></router-outlet>
  </div>

</div>
