<div class="module-shell">

  <mat-toolbar class="module-toolbar">

    <button mat-icon-button class="module-toolbar__menu-btn" aria-label="Menú">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="module-toolbar__title">Ropería</span>

    <nav class="module-toolbar__nav">
      <a mat-button class="module-toolbar__link" routerLink="/roperia/dashboard" routerLinkActive="is-active">
        <mat-icon>dashboard</mat-icon><span>Dashboard</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/roperia/tickets" routerLinkActive="is-active">
        <mat-icon>apartment</mat-icon><span>Tickets</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/roperia/guia-recojo" routerLinkActive="is-active">
        <mat-icon>person</mat-icon><span>Guia Recojo</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/roperia/consultas" routerLinkActive="is-active">
        <mat-icon>settings</mat-icon><span>Consultas</span>
      </a>
    </nav>

    <span class="module-toolbar__spacer"></span>

    <button mat-button class="module-toolbar__user" [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
      <span>{{ loginService.getLoginData()?.userName }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item [routerLink]="['/management']" routerLinkActive="router-link-active">
        <mat-icon>settings</mat-icon>
        Administrar
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item [routerLink]="['/profileUser']" routerLinkActive="router-link-active">
        <mat-icon>settings</mat-icon>
        Profile
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
        Cerrar Sesion
      </button>
    </mat-menu>

  </mat-toolbar>

  <div class="module-shell__content">
    <router-outlet></router-outlet>
  </div>

</div>
