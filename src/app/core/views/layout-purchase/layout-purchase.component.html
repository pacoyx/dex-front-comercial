<div class="module-shell">

  <mat-toolbar class="module-toolbar">

    <button mat-icon-button class="module-toolbar__menu-btn" (click)="toggleSidenav()" aria-label="Abrir menú principal">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="module-toolbar__title">Compras</span>

    <nav class="module-toolbar__nav">
      <a mat-button class="module-toolbar__link" routerLink="/purchase/dashboard" routerLinkActive="is-active">
        <mat-icon>dashboard</mat-icon><span>Dashboard</span>
      </a>
      <a mat-button class="module-toolbar__link" routerLink="/purchase/invoices" routerLinkActive="is-active">
        <mat-icon>description</mat-icon><span>Facturas</span>
      </a>
      @if (hasPermission('suppliers.access')) {
      <a mat-button class="module-toolbar__link" routerLink="/purchase/suppliers" routerLinkActive="is-active">
        <mat-icon>exit_to_app</mat-icon><span>Proveedores</span>
      </a>
      }
      <a mat-button class="module-toolbar__link" routerLink="/purchase/products" routerLinkActive="is-active">
        <mat-icon>exit_to_app</mat-icon><span>Productos</span>
      </a>

      <button mat-button class="module-toolbar__link" [matMenuTriggerFor]="consMenu">
        <mat-icon>person_search</mat-icon><span>Consultas</span>
      </button>
      <mat-menu #consMenu="matMenu">
        <button mat-menu-item [routerLink]="['/purchase/consultas/facturas']" routerLinkActive="router-link-active">
          <mat-icon>manage_accounts</mat-icon>
          Facturas
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/purchase/cuentas-pagar']" routerLinkActive="router-link-active">
          <mat-icon>account_balance_wallet</mat-icon>
          Cuentas por Pagar
        </button>
      </mat-menu>

      @if (hasPermission('reports.access')) {
      <button mat-button class="module-toolbar__link" [matMenuTriggerFor]="reportesMenu">
        <mat-icon>receipt_long</mat-icon><span>Reportes</span>
      </button>
      <mat-menu #reportesMenu="matMenu">
        <button mat-menu-item [routerLink]="['/purchase/reportes/registro-compras']" routerLinkActive="router-link-active">
          <mat-icon>receipt_long</mat-icon>
          Registro de Compras
        </button>
      </mat-menu>
      }

      <button mat-button class="module-toolbar__link" [matMenuTriggerFor]="mntMenu">
        <mat-icon>tab_group</mat-icon><span>Configuraciones</span>
      </button>
      <mat-menu #mntMenu="matMenu">
        <button mat-menu-item [routerLink]="['/purchase/unitmeasure']" routerLinkActive="router-link-active">
          <mat-icon>manage_accounts</mat-icon>
          Unidad de Medida
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/purchase/categoriesProduct']" routerLinkActive="router-link-active">
          <mat-icon>inventory_2</mat-icon>
          Categorias de Productos
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item [routerLink]="['/purchase/suppliers/import']" routerLinkActive="router-link-active">
          <mat-icon>cloud_upload</mat-icon>
          Importar Proveedores
        </button>
      </mat-menu>
    </nav>

    <span class="module-toolbar__spacer"></span>

    <button mat-button class="module-toolbar__user" [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
      <span>{{ loginService.getLoginData()?.userName }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item [routerLink]="['/profileUser']" routerLinkActive="router-link-active">
        <mat-icon>settings</mat-icon>
        Profile
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
        Cerrar Sesion
      </button>
    </mat-menu>

  </mat-toolbar>

  <div class="module-shell__content">
    <router-outlet></router-outlet>
  </div>

</div>
