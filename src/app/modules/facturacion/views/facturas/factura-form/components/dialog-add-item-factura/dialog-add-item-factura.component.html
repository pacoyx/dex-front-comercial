<div class="dialog-header">
    <div class="dialog-header__title">
        <mat-icon>{{ data.isAdd ? 'post_add' : 'edit' }}</mat-icon>
        <h2 mat-dialog-title>{{ titulo }}</h2>
    </div>
    <button mat-icon-button (click)="onCancel()" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="dialog-content">

    <mat-form-field appearance="outline" class="field--full">
        <mat-label>Producto / Servicio</mat-label>
        <input type="text" matInput [formControl]="productControl" [matAutocomplete]="auto"
            placeholder="Escribir nombre del servicio">
        <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onProductSelected($event)"
            [displayWith]="displayFn">
            <mat-option *ngFor="let product of filteredProducts | async" [value]="product">
                {{ product.name | titlecase }}
            </mat-option>
        </mat-autocomplete>
    </mat-form-field>

    <div class="form-grid">
        <mat-form-field appearance="outline">
            <mat-label>Cantidad</mat-label>
            <input type="number" matInput [(ngModel)]="cantidad" min="0.01" step="0.01">
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Precio Unit.</mat-label>
            <input type="number" matInput [(ngModel)]="precioUnitario" min="0" step="0.01">
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Descuento</mat-label>
            <input type="number" matInput [(ngModel)]="descuento" min="0" step="0.01">
        </mat-form-field>
    </div>

    <div class="total-card">
        <span class="total-card__label">Total línea</span>
        <span class="total-card__value">{{ lineTotalPreview | number:'0.2-2' }}</span>
    </div>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="!productoId">
        <mat-icon>check</mat-icon>
        Guardar
    </button>
</mat-dialog-actions>
