<div class="dialog-header">
    <div class="dialog-header__title">
        <mat-icon>person_add</mat-icon>
        <h2 mat-dialog-title>{{ titulo }}</h2>
    </div>
    <button mat-icon-button (click)="onCancel()" [disabled]="loadingSave" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="dialog-content">
    @if (validationErrors.length > 0) {
    <div class="alert alert--error">
        <ul>
            @for (e of validationErrors; track e) {
            <li>{{ e }}</li>
            }
        </ul>
    </div>
    }

    <form [formGroup]="contactoForm">
        <div class="form-grid">

            <mat-form-field appearance="outline" class="field--full">
                <mat-label>Nombre Completo</mat-label>
                <input matInput formControlName="fullName">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Cargo</mat-label>
                <input matInput formControlName="position">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Teléfono</mat-label>
                <input matInput formControlName="phoneNumber">
            </mat-form-field>

            <mat-form-field appearance="outline" class="field--full">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email" type="email">
            </mat-form-field>

            <div class="toggle-field field--full">
                <mat-slide-toggle formControlName="isPrimary">Contacto principal</mat-slide-toggle>
            </div>

        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()" [disabled]="loadingSave">Cancelar</button>

    @if (loadingSave) {
    <button mat-flat-button color="primary" disabled>
        <app-loading></app-loading>
        Grabando...
    </button>
    } @else {
    <button mat-flat-button color="primary" (click)="onSubmit()">
        <mat-icon>check</mat-icon>
        Grabar
    </button>
    }
</mat-dialog-actions>
