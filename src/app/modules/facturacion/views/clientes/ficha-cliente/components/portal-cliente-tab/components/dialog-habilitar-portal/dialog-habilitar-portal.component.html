<div class="dialog-header">
    <div class="dialog-header__title">
        <mat-icon>lock_open</mat-icon>
        <h2 mat-dialog-title>Habilitar Portal Cliente</h2>
    </div>
    <button mat-icon-button (click)="onCancel()" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="dialog-content">

    <mat-form-field appearance="outline" class="field--full">
        <mat-label>Nombre Administrador</mat-label>
        <input type="text" matInput [(ngModel)]="fullName">
    </mat-form-field>

    <mat-form-field appearance="outline" class="field--full">
        <mat-label>Correo Electrónico</mat-label>
        <input type="email" matInput [(ngModel)]="email">
    </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()" [disabled]="saving">Cancelar</button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="!isValid || saving">
        @if (saving) {
        <app-loading></app-loading>
        } @else {
        <mat-icon>lock_open</mat-icon>
        }
        Habilitar
    </button>
</mat-dialog-actions>
