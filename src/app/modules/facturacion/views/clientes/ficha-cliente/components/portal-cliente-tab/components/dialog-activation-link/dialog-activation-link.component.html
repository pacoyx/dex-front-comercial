<div class="dialog-header">
    <div class="dialog-header__title">
        <mat-icon>link</mat-icon>
        <h2 mat-dialog-title>{{ data.title }}</h2>
    </div>
    <button mat-icon-button (click)="onClose()" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="dialog-content">
    <p class="hint">Comparte este link con el administrador del cliente para que active su cuenta en el Portal.</p>
    <div class="link-box">
        <span class="link-box__url">{{ data.activationUrl }}</span>
        <button mat-icon-button (click)="copiar()" aria-label="Copiar" matTooltip="Copiar">
            <mat-icon>content_copy</mat-icon>
        </button>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-flat-button color="primary" (click)="onClose()">Cerrar</button>
</mat-dialog-actions>
