<div class="dialog-header">
    <div class="dialog-header__title">
        <mat-icon>person_off</mat-icon>
        <h2 mat-dialog-title>Dar de Baja a {{ data.employeeName }}</h2>
    </div>
    <button mat-icon-button (click)="onCancel()" [disabled]="loadingSave" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="dialog-content">
    <p class="warning-text">Esta acción marcará al trabajador como inactivo. No se puede deshacer.</p>

    @if (validationErrors.length > 0) {
    <div class="alert alert--error">
        <ul>
            @for (e of validationErrors; track e) {
            <li>{{ e }}</li>
            }
        </ul>
    </div>
    }

    <form [formGroup]="form">
        <div class="form-grid">
            <mat-form-field appearance="outline" class="field--full">
                <mat-label>Fecha de Baja</mat-label>
                <input matInput [matDatepicker]="picker" formControlName="terminationDate">
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="outline" class="field--full">
                <mat-label>Observación</mat-label>
                <textarea matInput formControlName="observation" rows="3"></textarea>
            </mat-form-field>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()" [disabled]="loadingSave">Cancelar</button>

    @if (loadingSave) {
    <button mat-flat-button color="warn" disabled>
        <app-loading></app-loading>
        Procesando...
    </button>
    } @else {
    <button mat-flat-button color="warn" (click)="onSubmit()">
        <mat-icon>person_off</mat-icon>
        Dar de Baja
    </button>
    }
</mat-dialog-actions>
