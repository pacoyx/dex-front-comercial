<div class="dialog-header">
    <div class="dialog-header__title">
        <mat-icon>more_time</mat-icon>
        <h2 mat-dialog-title>Registrar Hora Extra</h2>
    </div>
    <button mat-icon-button (click)="onCancel()" [disabled]="loadingSave" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="dialog-content">
    @if (validationErrors.length > 0) {
    <div class="alert alert--error">
        <ul>
            @for (e of validationErrors; track e) {
            <li>{{ e }}</li>
            }
        </ul>
    </div>
    }

    <form [formGroup]="form">
        <div class="form-grid">
            <mat-form-field appearance="outline">
                <mat-label>Fecha</mat-label>
                <input matInput [matDatepicker]="picker" formControlName="date">
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Horas</mat-label>
                <input matInput type="number" step="0.5" formControlName="hours">
            </mat-form-field>

            <mat-form-field appearance="outline" class="field--full">
                <mat-label>Observación</mat-label>
                <textarea matInput formControlName="observation" rows="2"></textarea>
            </mat-form-field>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()" [disabled]="loadingSave">Cancelar</button>

    @if (loadingSave) {
    <button mat-flat-button color="primary" disabled>
        <app-loading></app-loading>
        Grabando...
    </button>
    } @else {
    <button mat-flat-button color="primary" (click)="onSubmit()">
        <mat-icon>check</mat-icon>
        Grabar
    </button>
    }
</mat-dialog-actions>
