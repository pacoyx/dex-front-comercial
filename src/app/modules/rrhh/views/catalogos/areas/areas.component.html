<div class="container-mnt">

    <div class="page-header">
        <div class="page-header__title">
            <mat-icon>account_tree</mat-icon>
            <div class="page-header__heading">
                <h1>Áreas</h1>
                <span class="page-header__subtitle">Administra las áreas de la organización</span>
            </div>
        </div>

        <div class="page-header__actions">
            <button mat-flat-button color="primary" (click)="nuevaArea()">
                <mat-icon>add</mat-icon>
                Nueva Área
            </button>
        </div>
    </div>

    <mat-card class="panel" appearance="outlined">
        <mat-card-content class="filtros-row">
            <mat-form-field appearance="outline" class="campo-filtro">
                <mat-label>Buscar por nombre</mat-label>
                <input matInput [(ngModel)]="filtro" (ngModelChange)="aplicarFiltro()" placeholder="Nombre del área">
                <mat-icon matIconSuffix>search</mat-icon>
            </mat-form-field>
        </mat-card-content>
    </mat-card>

    <mat-card class="panel panel-tabla" appearance="outlined">
        <mat-card-content class="tabla-scroll">
            <table mat-table [dataSource]="dataSource" class="detail-table">

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Editar </th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button (click)="editarArea(element)" matTooltip="Editar">
                            <mat-icon>edit</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef> Nombre </th>
                    <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef> Estado </th>
                    <td mat-cell *matCellDef="let element">
                        <button class="status-chip"
                            [class.status-chip--activo]="element.isActive"
                            [class.status-chip--inactivo]="!element.isActive"
                            (click)="toggleEstado(element)"
                            [matTooltip]="element.isActive ? 'Clic para desactivar' : 'Clic para activar'">
                            <span class="status-chip__dot"></span>
                            {{ element.isActive ? 'Activo' : 'Inactivo' }}
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns" class="cabecera"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell sin-datos" [attr.colspan]="displayedColumns.length">
                        No se encontraron áreas.
                    </td>
                </tr>
            </table>
        </mat-card-content>
    </mat-card>

</div>
