<table mat-table [dataSource]="dataUser()" matSort class="detail-table">

    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="col-numeric"> ID </th>
        <td mat-cell *matCellDef="let element" class="col-numeric"> {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Usuario </th>
        <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Correo </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
    </ng-container>

    <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Rol </th>
        <td mat-cell *matCellDef="let element"> {{element.role}} </td>
    </ng-container>

    <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let element">
            @switch (element.status) {
            @case ('A') {
            <span class="status-chip status-chip--active">
                <span class="status-chip__dot"></span>
                Activo
            </span>
            }
            @default {
            <span class="status-chip status-chip--inactive">
                <span class="status-chip__dot"></span>
                Inactivo
            </span>
            }
            }
        </td>
    </ng-container>

    <ng-container matColumnDef="operaciones">
        <th mat-header-cell *matHeaderCellDef class="col-actions"> Acciones </th>
        <td mat-cell *matCellDef="let element" class="col-actions">
            <button mat-icon-button (click)="editUser(element)" aria-label="Editar">
                <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="eliminarUser(element)" aria-label="Eliminar">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="cabecera"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell sin-datos" [attr.colspan]="displayedColumns.length">
            No se encontraron usuarios.
        </td>
    </tr>
</table>
