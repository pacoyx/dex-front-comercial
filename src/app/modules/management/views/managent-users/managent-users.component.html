<div class="container-usuarios">

    <div class="page-header">
        <div class="page-header__title">
            <mat-icon>groups</mat-icon>
            <div class="page-header__heading">
                <h1>Registro de Usuarios</h1>
                <span class="page-header__subtitle">Administra las cuentas de acceso al sistema</span>
            </div>
        </div>

        <div class="page-header__actions">
            <button mat-flat-button color="primary" (click)="newUser()">
                <mat-icon>person_add</mat-icon>
                Nuevo Usuario
            </button>
        </div>
    </div>

    <div class="panel">
        <div class="filtros-row">
            <mat-form-field appearance="outline" class="campo-buscar">
                <mat-label>Buscar Usuario</mat-label>
                <input matInput placeholder="Buscar">
            </mat-form-field>
            <button mat-stroked-button (click)="limpiaFiltro()" [disabled]="!bolFiltro">
                <mat-icon>filter_alt_off</mat-icon>
                Limpiar
            </button>
        </div>
    </div>

    @if(loading){
    <div class="loading-row">
        <app-loading></app-loading>
        <span>Cargando usuarios...</span>
    </div>
    }

    <div class="panel panel-tabla">
        <div class="tabla-scroll">
            <app-table-listado-mnt-user [dataUser]="listaUsuarios" (reLoadUser)="cargarUsuarios($event)" />
        </div>
    </div>

</div>
