<h2 mat-dialog-title>Agregar Destinatario</h2>

<mat-dialog-content class="dialog-content">
    <mat-form-field appearance="outline" class="field--full">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" [(ngModel)]="email" placeholder="correo@empresa.com">
    </mat-form-field>

    <mat-radio-group [(ngModel)]="recipientType" class="radio-group">
        <mat-radio-button [value]="RecipientType.To">Para (TO)</mat-radio-button>
        <mat-radio-button [value]="RecipientType.Bcc">Copia oculta (BCC)</mat-radio-button>
    </mat-radio-group>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" [disabled]="!esValido" (click)="agregar()">Agregar</button>
</mat-dialog-actions>
