<h2 mat-dialog-title>Enviar Correo de Prueba</h2>

<mat-dialog-content class="dialog-content">
    <p class="dialog-hint">
        Se enviará un correo de prueba (asunto con prefijo "[PRUEBA]") únicamente a la dirección indicada.
        No afecta la programación ni queda registrado en el historial de ejecuciones.
    </p>
    <mat-form-field appearance="outline" class="field--full">
        <mat-label>Correo de destino</mat-label>
        <input matInput type="email" [(ngModel)]="testEmail" placeholder="miusuario@empresa.com"
            (keydown.enter)="enviar()">
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" [disabled]="!esValido" (click)="enviar()">Enviar</button>
</mat-dialog-actions>
