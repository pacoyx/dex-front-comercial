<div class="dialog-header">
    <div class="dialog-header__title">
        <mat-icon>cancel</mat-icon>
        <h2 mat-dialog-title>Rechazar Pedido {{ data.orderNumber }}</h2>
    </div>
    <button mat-icon-button (click)="onCancel()" [disabled]="loadingSave" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="dialog-content">
    @if (validationErrors.length > 0) {
    <div class="alert alert--error">
        <ul>
            @for (e of validationErrors; track e) {
            <li>{{ e }}</li>
            }
        </ul>
    </div>
    }

    <form [formGroup]="form">
        <mat-form-field appearance="outline" class="field--full">
            <mat-label>Motivo (opcional)</mat-label>
            <textarea matInput formControlName="reason" rows="3"
                placeholder="Ej: No cubrimos esa zona todavía"></textarea>
        </mat-form-field>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()" [disabled]="loadingSave">Cancelar</button>

    @if (loadingSave) {
    <button mat-flat-button color="warn" disabled>
        <app-loading></app-loading>
        Rechazando...
    </button>
    } @else {
    <button mat-flat-button color="warn" (click)="onSubmit()">
        <mat-icon>cancel</mat-icon>
        Rechazar
    </button>
    }
</mat-dialog-actions>
