<div class="tabla-scroll">
    <table mat-table [dataSource]="dataSource" class="detail-table">
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Servicio</th>
            <td mat-cell *matCellDef="let element; let i = index"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef>Precio</th>
            <td mat-cell *matCellDef="let element;"> {{element.price | currency:' ':'symbol':'0.2-2'}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="cabecera"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="agregarItem(row)"
            class="clickable-row"></tr>

        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell sin-datos" [attr.colspan]="displayedColumns.length">
                No se encontraron servicios para la búsqueda.
            </td>
        </tr>
    </table>
</div>
