<div class="container-mnt-impresiones-pendientes">
    <h2>
        <mat-icon>print</mat-icon>
        Impresiones Pendientes
    </h2>

    <div class="section-controls-mnt-impresiones-pendientes">

        <button mat-fab extended (click)="cargarImpresionesPendientes()">
            <mat-icon>refresh</mat-icon>
            Actualizar
        </button>

    </div>
    <div>
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Id </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>

            <ng-container matColumnDef="workGuideId">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Guía </th>
                <td mat-cell *matCellDef="let element"> {{element.workGuideId}} </td>
            </ng-container>

            <ng-container matColumnDef="printerId">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Impresora </th>
                <td mat-cell *matCellDef="let element"> {{element.printerId}} </td>
            </ng-container>

            <ng-container matColumnDef="documentType">
                <th mat-header-cell *matHeaderCellDef> Tipo de Documento </th>
                <td mat-cell *matCellDef="let element"> {{element.documentType}} </td>
            </ng-container>

            <ng-container matColumnDef="retryCount">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Reintentos </th>
                <td mat-cell *matCellDef="let element" style="text-align: center;"> {{element.retryCount}} </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> Estado </th>
                <td mat-cell *matCellDef="let element" style="text-align: center;"> {{element.status}} </td>
            </ng-container>

            <ng-container matColumnDef="createdAt">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha de Creación </th>
                <td mat-cell *matCellDef="let element">
                    {{element.createdAt | date:'dd/MM/yyyy HH:mm'}}
                </td>
            </ng-container>

            <ng-container matColumnDef="operaciones">
                <th mat-header-cell *matHeaderCellDef> Operaciones </th>
                <td mat-cell *matCellDef="let element">
                    <div style="display: flex; justify-content: space-evenly;">
                        <button mat-mini-fab (click)="cancelarImpresion(element)" matTooltip="Cancelar">
                            <mat-icon style="color: red;">cancel</mat-icon>
                        </button>
                        <button mat-mini-fab (click)="reimprimirImpresion(element)" matTooltip="Reimprimir">
                            <mat-icon>print</mat-icon>
                        </button>
                    </div>
                </td>
                <td mat-footer-cell *matFooterCellDef> </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="cabecera"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>

</div>
