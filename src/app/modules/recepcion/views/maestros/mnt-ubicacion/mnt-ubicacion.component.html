<div class="container-mnt-ubicaciones">

    <div class="page-header">
        <div class="page-header__title">
            <mat-icon>pin_drop</mat-icon>
            <div class="page-header__heading">
                <h1>Registro de Ubicaciones</h1>
                <span class="page-header__subtitle">Administra las ubicaciones registradas</span>
            </div>
        </div>

        <div class="page-header__actions">
            <button mat-flat-button color="primary" (click)="crearUbicacion()">
                <mat-icon>add_location</mat-icon>
                Nueva Ubicación
            </button>
        </div>
    </div>

    <div class="panel panel-tabla">
        <div class="tabla-scroll">
            <table mat-table [dataSource]="dataSource" matSort class="detail-table">

                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Id </th>
                    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
                    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                </ng-container>

                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Descripción </th>
                    <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                </ng-container>

                <ng-container matColumnDef="operaciones">
                    <th mat-header-cell *matHeaderCellDef> Operaciones </th>
                    <td mat-cell *matCellDef="let element">
                        <div style="display: flex; justify-content: space-evenly;">
                            <button mat-icon-button (click)="editUbicacion(element)">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button (click)="deleteUbicacion(element)">
                                <mat-icon style="color: red;">delete</mat-icon>
                            </button>
                        </div>
                    </td>
                    <td mat-footer-cell *matFooterCellDef> </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns" class="cabecera"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell sin-datos" [attr.colspan]="displayedColumns.length">
                        No se encontraron ubicaciones registradas.
                    </td>
                </tr>
            </table>
        </div>
    </div>

</div>
