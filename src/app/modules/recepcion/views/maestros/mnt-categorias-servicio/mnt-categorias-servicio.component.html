<div class="container-mnt-categorias">

    <div class="page-header">
        <div class="page-header__title">
            <mat-icon>category</mat-icon>
            <div class="page-header__heading">
                <h1>Categorías de Servicio</h1>
                <span class="page-header__subtitle">Agrupan los servicios registrados (ej. Lavado, Planchado,
                    Zapatillas)</span>
            </div>
        </div>
        <div class="page-header__actions">
            <button mat-flat-button color="primary" (click)="crearCategoria()">
                <mat-icon>add</mat-icon>
                Nueva Categoría
            </button>
        </div>
    </div>

    <div class="panel panel-tabla">
        <div class="tabla-scroll">
            <table mat-table [dataSource]="dataSource" class="detail-table">

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef> Nombre </th>
                    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                </ng-container>

                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef> Descripción </th>
                    <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                </ng-container>

                <ng-container matColumnDef="icon">
                    <th mat-header-cell *matHeaderCellDef> Ícono </th>
                    <td mat-cell *matCellDef="let element">
                        @if (element.icon) {
                        <mat-icon matTooltip="{{element.icon}}">{{element.icon}}</mat-icon>
                        }
                    </td>
                </ng-container>

                <ng-container matColumnDef="operaciones">
                    <th mat-header-cell *matHeaderCellDef> Operaciones </th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button (click)="editarCategoria(element)" matTooltip="Editar">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="eliminarCategoria(element)" matTooltip="Eliminar">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns" class="cabecera"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell sin-datos" [attr.colspan]="displayedColumns.length">
                        No se encontraron categorías de servicio registradas.
                    </td>
                </tr>
            </table>
        </div>
    </div>

</div>
