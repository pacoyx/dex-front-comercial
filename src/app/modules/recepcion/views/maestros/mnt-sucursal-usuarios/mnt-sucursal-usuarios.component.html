<div class="container-mnt-sucursal-usuarios">
    <h2>
        <mat-icon>group</mat-icon>
        Usuarios de la Sucursal
    </h2>

    <div class="section-controls-mnt-sucursal-usuarios">

        <button mat-fab extended (click)="regresarSucursales()">
            <mat-icon>arrow_back</mat-icon>
            Regresar a Sucursales
        </button>

        <button mat-fab extended (click)="crearSucursalUsuario()">
            <mat-icon>person_add</mat-icon>
            Nuevo Usuario
        </button>

    </div>
    <div>
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Id </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>

            <ng-container matColumnDef="userName">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Usuario </th>
                <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> Estado </th>
                <td mat-cell *matCellDef="let element" style="text-align: center;">
                    @switch (element.status) {
                    @case ('A') {
                    <span style="color: green;">Activo</span>
                    }
                    @case ('I') {
                    <span style="color: red;">Inactivo</span>
                    }
                    @default {
                    <span style="color: red;">Inactivo</span>
                    }
                    }
                </td>
            </ng-container>

            <ng-container matColumnDef="operaciones">
                <th mat-header-cell *matHeaderCellDef> Operaciones </th>
                <td mat-cell *matCellDef="let element">
                    <div style="display: flex; justify-content: space-evenly;">
                        <button mat-mini-fab (click)="editSucursalUsuario(element)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-mini-fab (click)="deleteSucursalUsuario(element)">
                            <mat-icon style="color: red;">delete</mat-icon>
                        </button>
                    </div>
                </td>
                <td mat-footer-cell *matFooterCellDef> </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="cabecera"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>

</div>
