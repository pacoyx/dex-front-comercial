<div class="container-mnt-distritos">

    <div class="page-header">
        <div class="page-header__title">
            <mat-icon>map</mat-icon>
            <div class="page-header__heading">
                <h1>Distritos</h1>
                <span class="page-header__subtitle">Distritos habilitados para el canal de pedidos web, por zona</span>
            </div>
        </div>
        <div class="page-header__actions">
            <button mat-flat-button color="primary" (click)="crearDistrito()">
                <mat-icon>add_location</mat-icon>
                Nuevo Distrito
            </button>
        </div>
    </div>

    <div class="panel panel-tabla">
        <div class="tabla-scroll">
            <table mat-table [dataSource]="dataSource" class="detail-table">

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef> Distrito </th>
                    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                </ng-container>

                <ng-container matColumnDef="zoneName">
                    <th mat-header-cell *matHeaderCellDef> Zona </th>
                    <td mat-cell *matCellDef="let element"> {{element.zoneName}} </td>
                </ng-container>

                <ng-container matColumnDef="isActive">
                    <th mat-header-cell *matHeaderCellDef> Estado </th>
                    <td mat-cell *matCellDef="let element">
                        @if (element.isActive) {
                        <span class="status-chip status-chip--activo"><span class="status-chip__dot"></span>Activo</span>
                        } @else {
                        <span class="status-chip status-chip--inactivo"><span class="status-chip__dot"></span>Inactivo</span>
                        }
                    </td>
                </ng-container>

                <ng-container matColumnDef="operaciones">
                    <th mat-header-cell *matHeaderCellDef> Operaciones </th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button (click)="editarDistrito(element)">
                            <mat-icon>edit</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns" class="cabecera"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell sin-datos" [attr.colspan]="displayedColumns.length">
                        No se encontraron distritos registrados.
                    </td>
                </tr>
            </table>
        </div>
    </div>

</div>
