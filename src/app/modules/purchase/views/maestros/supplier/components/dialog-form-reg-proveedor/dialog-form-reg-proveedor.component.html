<div class="dialog-header">
    <div class="dialog-header__title">
        <mat-icon>edit_note</mat-icon>
        <h2 mat-dialog-title>{{titulo}}</h2>
    </div>
    <button mat-icon-button (click)="onCancel()" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="dialog-content">
    <form [formGroup]="supplierForm">
        <div class="form-grid">

            <mat-form-field appearance="outline" class="field--full">
                <mat-label>Razon Social</mat-label>
                <input matInput formControlName="name">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>RUC</mat-label>
                <input matInput formControlName="ruc">
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Teléfono</mat-label>
                <input matInput formControlName="phone">
            </mat-form-field>

            <mat-form-field appearance="outline" class="field--full">
                <mat-label>Direccion</mat-label>
                <input matInput formControlName="address">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email">
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Estado</mat-label>
                <mat-select formControlName="status">
                    <mat-option value="A"> Activo </mat-option>
                    <mat-option value="I"> Inactivo </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Contacto</mat-label>
                <input matInput formControlName="contactName">
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Contacto Telefono</mat-label>
                <input matInput formControlName="contactPhone">
            </mat-form-field>

        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()">Cancelar</button>

    @if(loadingSave){
    <button mat-flat-button color="primary" disabled>
        <app-loading></app-loading>
        Grabando...
    </button>
    }

    @if(!loadingSave){
    <button mat-flat-button color="primary" (click)="onSubmit()">
        <mat-icon>check</mat-icon>
        Grabar
    </button>
    }
</mat-dialog-actions>
