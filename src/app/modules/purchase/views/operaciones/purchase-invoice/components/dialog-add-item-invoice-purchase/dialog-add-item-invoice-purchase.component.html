<div class="dialog-header">
    <div class="dialog-header__title">
        <mat-icon>{{ data.isAdd ? 'post_add' : 'edit' }}</mat-icon>
        <h2 mat-dialog-title>{{ titulo }}</h2>
    </div>
    <button mat-icon-button (click)="onCancel()" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="dialog-content">

    <mat-form-field appearance="outline" class="field--full">
        <mat-label>Producto / Servicio</mat-label>
        <input type="text" matInput [formControl]="productControl" [matAutocomplete]="auto"
            placeholder="escribir nombre producto">
        <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onProductSelected($event)"
            [displayWith]="displayFn">
            <mat-option *ngFor="let product of filteredProducts | async" [value]="product">
                {{ product.name | titlecase }}
            </mat-option>
        </mat-autocomplete>
    </mat-form-field>

    <div class="form-grid">
        <mat-form-field appearance="outline">
            <mat-label>Precio</mat-label>
            <input matInput type="number" min="0" step="1" [(ngModel)]="precioUnitario">
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Unid.Medida</mat-label>
            <input matInput type="text" [(ngModel)]="unidadMedida" disabled>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Cantidad</mat-label>
            <input matInput type="number" min="0" step="1" [(ngModel)]="cantidad">
        </mat-form-field>
    </div>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()">Cancelar</button>
    @if (!loadingSave) {
    <button mat-flat-button color="primary" (click)="onSubmit()">
        <mat-icon>check</mat-icon>
        Agregar
    </button>
    }
</mat-dialog-actions>
